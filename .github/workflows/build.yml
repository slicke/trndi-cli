name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # fp-units-fv provides Free Vision; libcurl4-openssl-dev provides the
      # libcurl.so link name trndi.curl binds against.
      - name: Install Free Pascal
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc fp-units-fv libcurl4-openssl-dev

      - name: Build
        run: make

      - name: Smoke test
        run: |
          ./bin/trndi-cli --help
          # No settings in CI: the unconfigured case must exit 1, not crash.
          set +e
          ./bin/trndi-cli
          code=$?
          set -e
          test "$code" -eq 1

      - name: Upload binary
        run: cp bin/trndi-cli trndi-cli-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: trndi-cli-linux-${{ matrix.arch }}
          path: trndi-cli-linux-${{ matrix.arch }}

  # 32-bit x86 for the old machines that make good bedside displays. There is
  # no i386 runner and apt has no cross-fpc, so an i386 Debian container does
  # the build — 32-bit x86 runs natively on the amd64 runner, no emulation.
  # It goes through `docker run` rather than the job's `container:` key because
  # the Actions runner ships no i386 node, so the JS actions (checkout, upload)
  # have to stay on the host.
  linux-i686:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and smoke test in an i386 container
        run: |
          docker run --rm --platform linux/386 -v "$PWD:/src" -w /src i386/debian:12 sh -euc '
            apt-get update
            apt-get install -y --no-install-recommends make fpc fp-units-fv libcurl4-openssl-dev
            make
            ./bin/trndi-cli --help
            # No settings in CI: the unconfigured case must exit 1, not crash.
            set +e
            ./bin/trndi-cli
            code=$?
            set -e
            test "$code" -eq 1
          '

      - name: Upload binary
        run: cp bin/trndi-cli trndi-cli-linux-i686
      - uses: actions/upload-artifact@v4
        with:
          name: trndi-cli-linux-i686
          path: trndi-cli-linux-i686

  # No aarch64 leg: FreeBSD's package builders do not ship fpc for aarch64
  # (the port is amd64/i386-only), verified 2026-08-16 — the VM's pkg install
  # finds nothing. Revisit if lang/fpc ever gains ONLY_FOR_ARCHS aarch64.
  freebsd:
    strategy:
      matrix:
        include:
          - vmarch: x86_64
            arch: amd64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # FreeBSD has no native runner; vmactions boots a FreeBSD VM and rsyncs
      # the workspace in. FPC's units are split into fpc-* subpackages whose
      # exact set varies by release, so install every one that exists.
      - name: Build and smoke test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          arch: ${{ matrix.vmarch }}
          prepare: |
            pkg install -y gmake curl fpc
            pkg install -y $(pkg search -x -q '^fpc-' | sed 's/-[0-9][^ ]*$//' | sort -u)
          run: |
            set -e
            gmake FPCEXTRA='-Fl/usr/local/lib'
            ./bin/trndi-cli --help
            code=0; ./bin/trndi-cli || code=$?
            [ "$code" -eq 1 ]

      # vmactions copies the workspace back out of the VM after `run`.
      - name: Upload binary
        run: cp bin/trndi-cli trndi-cli-freebsd-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: trndi-cli-freebsd-${{ matrix.arch }}
          path: trndi-cli-freebsd-${{ matrix.arch }}

  # Haiku has no runner either, but cross-platform-actions boots the
  # haiku-builder image (r1beta5, x86-64) under QEMU on a Linux one. Upstream
  # Trndi already supports Haiku; here X_CONSOLE selects trndi.native.console
  # as it does everywhere, so only the toolchain is in question — HaikuPorts'
  # fpc pulls libncurses, which is what FPC's video/keyboard drivers (and so
  # Free Vision) need. devel:libcurl for the unversioned libcurl.so the
  # bindings name. The VM syncs the workspace both ways, so the binary comes
  # back to the runner for the artifact step.
  haiku:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Start Haiku VM
        uses: cross-platform-actions/action@v1.4.0
        with:
          operating_system: haiku
          version: 'r1beta5'
          architecture: x86-64
          shell: bash

      # HaikuPorts' r1beta5 route is currently dead: the front end redirects to
      # a CDN that carries only master, and answers the repochecksum request
      # with a 2-byte JSON listing, so pkgman's refresh fails and it then 404s
      # on the package its cached index asked for. The same fpc revision does
      # exist under master, so fall back to fetching that file. Drop the
      # fallback once the mirror is whole again.
      - name: Install Free Pascal
        run: |
          if ! pkgman install -y fpc devel:libcurl; then
            curl -fL -o /tmp/fpc.hpkg \
              https://haikuports-repository.cdn.haiku-os.org/master/x86_64/current/packages/fpc-3.2.2-5-x86_64.hpkg
            pkgman install -y /tmp/fpc.hpkg
          fi

      # curl_devel is what normally provides the unversioned libcurl.so the
      # bindings name; with the repo down, give the linker a symlink to the
      # versioned library that ships with the base system instead.
      - name: Point the linker at libcurl
        run: |
          mkdir -p /boot/home/config/non-packaged/lib
          for l in /boot/system/lib/libcurl.so.*; do
            ln -sf "$l" /boot/home/config/non-packaged/lib/libcurl.so
            break
          done
          ls -l /boot/home/config/non-packaged/lib/

      - name: Build
        run: make FPCEXTRA='-Fl/boot/home/config/non-packaged/lib'

      - name: Smoke test
        run: |
          ./bin/trndi-cli --help
          # No settings in CI: the unconfigured case must exit 1, not crash.
          set +e
          ./bin/trndi-cli
          code=$?
          set -e
          test "$code" -eq 1

      - name: Stage binary
        run: cp bin/trndi-cli trndi-cli-haiku-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: trndi-cli-haiku-x86_64
          path: trndi-cli-haiku-x86_64

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Same toolchain source as trndi's own CI: the Lazarus installer bundles
      # fpc 3.2.2 at C:\Lazarus\fpc\..., which make.ps1 already looks for.
      # curl.exe (not the Invoke-WebRequest alias) because SourceForge
      # content-negotiates on User-Agent; the MZ check makes a mirror that
      # answers 200 with an HTML page fail loudly here instead of at install.
      - name: Install FPC (Lazarus bundle)
        shell: pwsh
        run: |
          curl.exe -L --fail -o lazarus.exe "https://sourceforge.net/projects/lazarus/files/Lazarus%20Windows%2064%20bits/Lazarus%204.8/lazarus-4.8-fpc-3.2.2-win64.exe/download"
          $fs = [System.IO.File]::OpenRead('lazarus.exe')
          $mz = New-Object byte[] 2
          $null = $fs.Read($mz, 0, 2)
          $fs.Close()
          if (($mz[0] -ne 0x4D) -or ($mz[1] -ne 0x5A)) {
            throw 'lazarus.exe is not a Windows executable - the mirror likely returned a web page.'
          }
          Start-Process '.\lazarus.exe' -ArgumentList '/VERYSILENT','/SP-','/NORESTART','/DIR=C:\Lazarus' -Wait

      - name: Build
        shell: pwsh
        run: .\make.ps1

      # The exe imports libcurl.dll at load time (console-native HTTP
      # transport), so the smoke test needs it beside the binary. The official
      # curl-for-Windows package names it libcurl-x64.dll; the import table
      # wants libcurl.dll, hence the rename.
      - name: Smoke test
        shell: pwsh
        run: |
          curl.exe -L --fail -o curlpkg.zip 'https://curl.se/windows/latest.cgi?p=win64-mingw.zip'
          Expand-Archive curlpkg.zip -DestinationPath curlpkg
          $dll = Get-ChildItem curlpkg -Recurse -Filter libcurl-x64.dll | Select-Object -First 1
          if (-not $dll) { throw 'libcurl-x64.dll not found in curl package' }
          Copy-Item $dll.FullName bin\libcurl.dll
          .\bin\trndi-cli.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # No settings in CI: the unconfigured case must exit 1, not crash.
          .\bin\trndi-cli.exe
          if ($LASTEXITCODE -ne 1) { throw "expected exit 1 when unconfigured, got $LASTEXITCODE" }
          # The pwsh step inherits the last native exit code — the 1 above is
          # the expected outcome, not a failure.
          exit 0

      - name: Upload binary
        shell: pwsh
        run: Copy-Item bin\trndi-cli.exe trndi-cli-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: trndi-cli-windows-x64
          path: trndi-cli-windows-x64.exe

  # ===================== RELEASE =====================
  # Trndi-style rolling releases: every push to main that builds green on all
  # platforms becomes tag build-<N> (starting at 100) with the binaries as
  # release assets.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [linux, linux-i686, freebsd, haiku, windows]
    runs-on: ubuntu-latest
    # Two quick pushes must not race the same build number.
    concurrency: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history *and* tags, for the build counter

      - name: Next build number
        id: ver
        run: |
          LATEST=$(git tag | grep -E '^build-[0-9]+$' | sed 's/^build-//' | sort -n | tail -1)
          echo "num=$(( ${LATEST:-99} + 1 ))" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=${{ steps.ver.outputs.num }}
          # No --target: like trndi, tag whatever main's HEAD is at publish
          # time. Targeting $GITHUB_SHA 403s as soon as a newer push has
          # landed, since the API refuses non-head SHAs for the token.
          gh release create "build-${NUM}" \
            --title "Build ${NUM}" \
            --notes "Automated build of ${GITHUB_SHA}. Setup: see MANUAL.md — Windows also needs libcurl.dll (README)." \
            dist/*/*
